<!doctype html>
<html>
<head><meta charset="utf-8"><title>梵高 · renderer</title>
<style>html,body{margin:0;background:#000}canvas{width:960px;height:540px;display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { init, renderFrame, warmup } from './main.js';

const canvas = document.getElementById('c');
const FPS = 30;
let encoder = null, out = [], decoderConfig = null;

function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

window.api = {
  async init() { const info = await init(canvas); return info; },

  // a single still (PNG, data URL) with warm-up so strokes are settled
  still(t) { warmup(t); renderFrame(t); return canvas.toDataURL('image/png'); },

  async startEncoder({ bitrate = 10e6 } = {}) {
    out = []; decoderConfig = null;
    encoder = new VideoEncoder({
      output: (chunk, meta) => {
        if (meta && meta.decoderConfig && meta.decoderConfig.description && !decoderConfig)
          decoderConfig = { codec: meta.decoderConfig.codec, description: b64(new Uint8Array(meta.decoderConfig.description)) };
        const buf = new Uint8Array(chunk.byteLength); chunk.copyTo(buf);
        out.push({ key: chunk.type === 'key', ts: chunk.timestamp, data: b64(buf) });
      },
      error: (e) => { window.__encErr = String(e); },
    });
    const cfg = { codec: 'avc1.640028', width: canvas.width, height: canvas.height, bitrate, framerate: FPS,
      avc: { format: 'avc' }, latencyMode: 'quality', bitrateMode: 'variable' };
    const sup = await VideoEncoder.isConfigSupported(cfg);
    encoder.configure(sup.supported ? cfg : { ...cfg, codec: 'avc1.42E028' });
    return sup.supported;
  },

  warm(t) { warmup(t); },

  // render + encode frames [i0, i1) of the clip starting at song time t0
  async encodeRange(t0, i0, i1) {
    for (let i = i0; i < i1; i++) {
      renderFrame(t0 + i / FPS);
      const vf = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      encoder.encode(vf, { keyFrame: i % (2 * FPS) === 0 });
      vf.close();
      while (encoder.encodeQueueSize > 4) await new Promise((r) => setTimeout(r, 2));
    }
    if (window.__encErr) throw new Error(window.__encErr);
    const chunks = out; out = [];
    return { chunks, decoderConfig };
  },

  async finish() { await encoder.flush(); const chunks = out; out = []; encoder.close(); return { chunks, decoderConfig }; },
};
window.__ready = true;
</script>
</body>
</html>
